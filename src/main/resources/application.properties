spring.application.name=gestion-expedientes

# Base de datos PostgreSQL (los valores se pueden redefinir con variables de entorno)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expedientes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema se crea con schema.sql (diagrama de entidad-relación) y Hibernate solo lo valida
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# Sesión (política 7 del apartado Seguridad): 15 minutos de inactividad, cookie HttpOnly y SameSite=Strict.
# En producción, con HTTPS, se define COOKIE_SECURE=true para agregar el atributo Secure.
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie

# Archivos: PDF, JPG o PNG de hasta 10 MB (RNF07)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Parámetros propios de la aplicación
app.almacenamiento=${ALMACENAMIENTO:./archivos}
app.bcrypt-fuerza=${BCRYPT_FUERZA:12}
app.max-intentos-fallidos=5
app.token-secreto=${TOKEN_SECRETO:reemplazar-por-un-secreto-aleatorio-de-al-menos-32-caracteres}
app.url-base=${URL_BASE:http://localhost:8080}
app.datos-ejemplo=${DATOS_EJEMPLO:true}
