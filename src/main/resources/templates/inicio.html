<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Inicio')}"></head>
<body>
<div class="marco">
    <header th:replace="~{fragmentos :: encabezado}"></header>
    <main class="contenido">
        <div th:replace="~{fragmentos :: mensajes}"></div>
        <h1 th:if="${actual.rol.name() == 'CLIENTE'}">Mis expedientes</h1>
        <h1 th:if="${actual.rol.name() == 'GESTOR'}">Expedientes asignados</h1>
        <h1 th:if="${actual.rol.name() == 'ADMINISTRADOR' or actual.rol.name() == 'ADMINISTRATIVO'}">Expedientes</h1>
        <div class="acciones" th:if="${actual.rol.name() == 'ADMINISTRATIVO'}">
            <a class="boton primario" th:href="@{/expedientes/nuevo}">Nuevo expediente</a>
        </div>
        <p th:if="${#lists.isEmpty(expedientes)}">No hay expedientes para mostrar.</p>
        <table th:unless="${#lists.isEmpty(expedientes)}">
            <thead>
            <tr><th>Número</th><th>Cliente</th><th>País y vía</th><th>Gestor</th><th>Estado</th><th>Inicio</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${expedientes}">
                <td><a th:href="@{/expedientes/{id}(id=${e.id})}" th:text="${e.numero}">2026-0001</a></td>
                <td th:text="${e.cliente.nombreCompleto()}">Pérez, Ana</td>
                <td th:text="${e.pais} + ' – ' + ${e.via}">Italia – Descendencia</td>
                <td th:text="${e.gestor.nombre}">López, Marta</td>
                <td th:text="${e.estado.nombre}">Iniciado</td>
                <td th:text="${#temporals.format(e.fechaInicio, 'dd/MM/yyyy')}">20/10/2026</td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
