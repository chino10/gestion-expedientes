# Configuración de las pruebas automatizadas: base de datos H2 en memoria en modo PostgreSQL
spring.datasource.url=jdbc:h2:mem:pruebas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.almacenamiento=target/archivos-prueba
app.bcrypt-fuerza=10
app.max-intentos-fallidos=5
app.token-secreto=secreto-de-pruebas-con-al-menos-treinta-y-dos-caracteres
app.url-base=http://localhost
app.datos-ejemplo=true
